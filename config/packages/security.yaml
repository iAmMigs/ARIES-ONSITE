security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # This is the CRITICAL part. It tells Symfony to check the 'admin_user' table.
        app_admin_provider:
            entity:
                class: App\Entity\AdminUser
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_admin_provider
            entry_point: App\Security\CampusAuthenticationEntryPoint
            form_login:
                login_path: app_auth_login_diliman
                check_path: app_auth_login_check
                default_target_path: app_admin_dispatch
                failure_path_parameter: _failure_path
            logout:
                path: app_logout
                target: app_home_diliman

    access_control:
        # Allow public access to login pages to prevent redirect loops
        - { path: ^/admin/diliman/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin/alabang/login, roles: PUBLIC_ACCESS }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        
        # Secure the admin URLs so only actual Admins can enter
        - { path: ^/alabang-admin, roles: ROLE_ADMIN }
        - { path: ^/diliman-admin, roles: ROLE_ADMIN }
        - { path: ^/admin, roles: ROLE_ADMIN }